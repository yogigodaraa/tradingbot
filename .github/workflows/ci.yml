name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Check names: "backend / test" and "frontend / test". Keep job ids stable.
  backend:
    uses: yogigodaraa/.github/.github/workflows/python-ci.yml@main
    with:
      working-directory: backend
      python-version: "3.12"

  frontend:
    uses: yogigodaraa/.github/.github/workflows/node-ci.yml@main
    with:
      working-directory: frontend
      # package.json has no "packageManager" field; pnpm-workspace.yaml needs pnpm 10.
      pnpm-version: "10"
